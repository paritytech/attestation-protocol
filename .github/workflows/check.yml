name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: forge build
        working-directory: evm
      - run: forge test
        working-directory: evm
      - run: bun run typecheck
        working-directory: evm
